<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Révision App PRO</title>
<style>
body{font-family:sans-serif;margin:0;background:#0f172a;color:white}
header{padding:15px;text-align:center;background:#020617}
input,button{padding:8px;margin:5px;border-radius:5px;border:none}
button{cursor:pointer}
.tabs{display:flex}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;background:#1e293b}
.tab.active{background:#38bdf8;color:black}
.content{display:none;padding:20px}
.content.active{display:block}
.item{display:flex;gap:10px;background:#1e293b;padding:10px;margin:10px 0}
img{max-width:100px;cursor:pointer}
.delete{background:red;color:white}
.download{background:green;color:white}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;justify-content:center;align-items:center}
.modal img{max-width:90%}
</style>
</head>
<body>

<header>
<h2>📚 Révision App PRO</h2>
<div id="userInfo"></div>
</header>

<div id="auth">
<input id="username" placeholder="Pseudo">
<input id="password" type="password" placeholder="Mot de passe">
<button onclick="register()">S'inscrire</button>
<button onclick="login()">Se connecter</button>
</div>

<div id="app" style="display:none">
<div class="tabs">
<div class="tab active" onclick="switchTab('cours',event)">Cours</div>
<div class="tab" onclick="switchTab('revision',event)">Révision</div>
</div>

<div id="cours" class="content active">
<input type="file" multiple onchange="handleFiles(event,'cours')">
<div id="coursList"></div>
</div>

<div id="revision" class="content">
<input type="file" multiple onchange="handleFiles(event,'revision')">
<div id="revisionList"></div>
</div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
<img id="modalImg">
</div>

<script>
let currentUser=null;

function getUsers(){return JSON.parse(localStorage.getItem('users')||'{}');}
function saveUsers(u){localStorage.setItem('users',JSON.stringify(u));}

function register(){
const u=document.getElementById('username').value;
const p=document.getElementById('password').value;
if(!u||!p) return alert('Remplis tout');
let users=getUsers();
if(users[u]) return alert('Existe déjà');
users[u]={password:p};
saveUsers(users);
alert('Compte créé');
}

function login(){
const u=document.getElementById('username').value;
const p=document.getElementById('password').value;
let users=getUsers();
if(!users[u]||users[u].password!==p) return alert('Erreur');
currentUser=u;
localStorage.setItem('session',u);
document.getElementById('auth').style.display='none';
document.getElementById('app').style.display='block';
updateUI();
render();
}

function isAdmin(){return currentUser==='bosstyme';}

function updateUI(){
document.getElementById('userInfo').textContent=
'Connecté: '+currentUser+(isAdmin()?' (ADMIN)':'');
}

function handleFiles(e,type){
for(let f of e.target.files){
const reader=new FileReader();
reader.onload=x=>{
let list=JSON.parse(localStorage.getItem(type)||'[]');
list.push({name:f.name,url:x.target.result,type:f.type});
localStorage.setItem(type,JSON.stringify(list));
render();
};
reader.readAsDataURL(f);
}
}

function deleteItem(type,i){
if(!isAdmin()) return alert('Admin seulement');
let list=JSON.parse(localStorage.getItem(type));
list.splice(i,1);
localStorage.setItem(type,JSON.stringify(list));
render();
}

function render(){
['cours','revision'].forEach(type=>{
let cont=document.getElementById(type+'List');
cont.innerHTML='';
let list=JSON.parse(localStorage.getItem(type)||'[]');
list.forEach((it,i)=>{
let d=document.createElement('div');d.className='item';

if(it.type.startsWith('image')){
let img=document.createElement('img');
img.src=it.url;img.onclick=()=>zoom(it.url);
d.appendChild(img);
}else{
let a=document.createElement('a');
a.href=it.url;a.textContent=it.name;a.target='_blank';
d.appendChild(a);
}

let dl=document.createElement('a');
dl.href=it.url;dl.download=it.name;dl.textContent='⬇️';dl.className='download';
d.appendChild(dl);

if(isAdmin()){
let del=document.createElement('button');
del.textContent='❌';del.className='delete';
del.onclick=()=>deleteItem(type,i);
d.appendChild(del);
}

cont.appendChild(d);
});
});
}

function switchTab(id,e){
document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
e.target.classList.add('active');
}

function zoom(src){
document.getElementById('modal').style.display='flex';
document.getElementById('modalImg').src=src;
}
function closeModal(){document.getElementById('modal').style.display='none';}

// session auto
const s=localStorage.getItem('session');
if(s){currentUser=s;document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';updateUI();render();}
</script>

</body>
</html>
