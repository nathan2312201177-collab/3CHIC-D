<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Révision Classe 3e PRO</title>
<style>
body{font-family:sans-serif;margin:0;background:#0f172a;color:white}
header{padding:20px;text-align:center;background:#020617}
h1{margin:0}
input,button{padding:10px;margin:5px;border-radius:6px;border:none}
button{cursor:pointer}
.tabs{display:flex}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;background:#1e293b}
.tab.active{background:#38bdf8;color:black;font-weight:bold}
.content{display:none;padding:20px}
.content.active{display:block}
.item{display:flex;gap:10px;background:#1e293b;padding:10px;margin:10px 0;border-radius:8px;align-items:center}
img{max-width:100px;cursor:pointer;border-radius:8px}
.delete{background:#ef4444;color:white}
.download{background:#22c55e;color:white}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;justify-content:center;align-items:center}
.modal img{max-width:90%}
#auth{padding:20px;text-align:center}
.note{font-size:14px;color:#94a3b8;margin-top:10px}
.logo{font-size:30px}
</style>
</head>
<body>

<header>
<div class="logo">📚✨ Révision 3e</div>
<p>Partage tes cours et révise facilement</p>
<div id="userInfo"></div>
</header>

<div id="auth">
<h3>Connexion / Inscription</h3>
<input id="username" placeholder="Pseudo"><br>
<input id="password" type="password" placeholder="Mot de passe"><br>
<button onclick="register()">S'inscrire</button>
<button onclick="login()">Se connecter</button>
<div class="note">
🔐 Ce système de connexion est mis en place pour la sécurité du site et pour éviter les modifications non autorisées.
</div>
</div>

<div id="app" style="display:none">
<div class="tabs">
<div class="tab active" onclick="switchTab('cours',event)">Cours</div>
<div class="tab" onclick="switchTab('revision',event)">Révision</div>
</div>

<div id="cours" class="content active">
<h3>📘 Cours</h3>
<input type="file" multiple onchange="handleFiles(event,'cours')">
<div id="coursList"></div>
</div>

<div id="revision" class="content">
<h3>🧠 Révision</h3>
<input type="file" multiple onchange="handleFiles(event,'revision')">
<div id="revisionList"></div>
</div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
<img id="modalImg">
</div>

<script>
let currentUser=null;

function getUsers(){return JSON.parse(localStorage.getItem('users')||'{}');}
function saveUsers(u){localStorage.setItem('users',JSON.stringify(u));}

function register(){
const u=username.value;
const p=password.value;
if(!u||!p) return alert('Remplis tous les champs');
let users=getUsers();
if(users[u]) return alert('Pseudo déjà utilisé');
users[u]={password:p};
saveUsers(users);
alert('Compte créé !');
}

function login(){
const u=username.value;
const p=password.value;
let users=getUsers();
if(!users[u]||users[u].password!==p) return alert('Identifiants incorrects');
currentUser=u;
localStorage.setItem('session',u);
auth.style.display='none';
app.style.display='block';
updateUI();
render();
}

function isAdmin(){return currentUser==='bosstyme';}

function updateUI(){
userInfo.textContent='Connecté : '+currentUser+(isAdmin()?' 👑 Admin':'');
}

function handleFiles(e,type){
for(let f of e.target.files){
const reader=new FileReader();
reader.onload=x=>{
let list=JSON.parse(localStorage.getItem(type)||'[]');
list.push({name:f.name,url:x.target.result,type:f.type});
localStorage.setItem(type,JSON.stringify(list));
render();
};
reader.readAsDataURL(f);
}
}

function deleteItem(type,i){
if(!isAdmin()) return alert('Seul l\'admin peut supprimer');
let list=JSON.parse(localStorage.getItem(type));
list.splice(i,1);
localStorage.setItem(type,JSON.stringify(list));
render();
}

function render(){
['cours','revision'].forEach(type=>{
let cont=document.getElementById(type+'List');
cont.innerHTML='';
let list=JSON.parse(localStorage.getItem(type)||'[]');
list.forEach((it,i)=>{
let d=document.createElement('div');d.className='item';

if(it.type.startsWith('image')){
let img=document.createElement('img');
img.src=it.url;img.onclick=()=>zoom(it.url);
d.appendChild(img);
}else{
let a=document.createElement('a');
a.href=it.url;a.textContent=it.name;a.target='_blank';
d.appendChild(a);
}

let dl=document.createElement('a');
dl.href=it.url;dl.download=it.name;dl.textContent='⬇️';dl.className='download';
d.appendChild(dl);

if(isAdmin()){
let del=document.createElement('button');
del.textContent='❌';del.className='delete';
del.onclick=()=>deleteItem(type,i);
d.appendChild(del);
}

cont.appendChild(d);
});
});
}

function switchTab(id,e){
content=document.querySelectorAll('.content');
tabs=document.querySelectorAll('.tab');
content.forEach(c=>c.classList.remove('active'));
tabs.forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
e.target.classList.add('active');
}

function zoom(src){modal.style.display='flex';modalImg.src=src}
function closeModal(){modal.style.display='none'}

const s=localStorage.getItem('session');
if(s){currentUser=s;auth.style.display='none';app.style.display='block';updateUI();render();}
</script>

</body>
</html>
