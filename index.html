<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Site Révision & Cours</title>
  <style>
    body { font-family: Arial; margin:0; background:#f4f4f4; }
    header { background:#333; color:white; padding:15px; text-align:center; }
    .tabs { display:flex; background:#444; }
    .tab { flex:1; padding:15px; text-align:center; color:white; cursor:pointer; }
    .tab.active { background:#222; }
    .content { display:none; padding:20px; background:white; }
    .content.active { display:block; }

    .image-container img {
      max-width:200px; margin:10px; border-radius:10px; cursor:pointer;
    }

    .pdf-item, .img-item {
      display:flex; align-items:center; gap:10px; margin:10px 0;
    }

    button {
      background:red; color:white; border:none; padding:5px 10px;
      border-radius:5px; cursor:pointer;
    }

    .download {
      background:green;
    }

    .modal {
      display:none; position:fixed; top:0; left:0;
      width:100%; height:100%; background:rgba(0,0,0,0.8);
      justify-content:center; align-items:center;
    }

    .modal img { max-width:90%; max-height:90%; }
  </style>
</head>
<body>

<header><h1>Mon Site de Révision</h1></header>

<div class="tabs">
  <div class="tab active" onclick="showTab('cours', event)">Cours</div>
  <div class="tab" onclick="showTab('revision', event)">Révision</div>
</div>

<div id="cours" class="content active">
  <h2>📘 Cours</h2>

  <h3>Images</h3>
  <input type="file" accept="image/*" onchange="addImage(event, 'coursImages')">
  <div id="coursImages"></div>

  <h3>PDF</h3>
  <input type="file" accept="application/pdf" onchange="addPDF(event, 'coursPDFs')">
  <div id="coursPDFs"></div>
</div>

<div id="revision" class="content">
  <h2>🧠 Révision</h2>

  <h3>Images</h3>
  <input type="file" accept="image/*" onchange="addImage(event, 'revisionImages')">
  <div id="revisionImages"></div>

  <h3>PDF</h3>
  <input type="file" accept="application/pdf" onchange="addPDF(event, 'revisionPDFs')">
  <div id="revisionPDFs"></div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<script>
function showTab(tabId, event) {
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  event.target.classList.add('active');
}

function addImage(event, containerId) {
  const container = document.getElementById(containerId);
  const file = event.target.files[0];

  if(file){
    const wrapper = document.createElement('div');
    wrapper.className = 'img-item';

    const img = document.createElement('img');
    const url = URL.createObjectURL(file);
    img.src = url;
    img.onclick = ()=>zoomImage(url);

    const download = document.createElement('a');
    download.href = url;
    download.download = file.name;
    download.textContent = 'Télécharger';
    download.className = 'download';

    const del = document.createElement('button');
    del.textContent='Supprimer';
    del.onclick=()=>wrapper.remove();

    wrapper.appendChild(img);
    wrapper.appendChild(download);
    wrapper.appendChild(del);
    container.appendChild(wrapper);
  }
}

function addPDF(event, containerId) {
  const container = document.getElementById(containerId);
  const file = event.target.files[0];

  if(file){
    const wrapper = document.createElement('div');
    wrapper.className='pdf-item';

    const link = document.createElement('a');
    const url = URL.createObjectURL(file);
    link.href = url;
    link.textContent = file.name;
    link.target='_blank';

    const download = document.createElement('a');
    download.href = url;
    download.download = file.name;
    download.textContent = 'Télécharger';
    download.className = 'download';

    const del = document.createElement('button');
    del.textContent='Supprimer';
    del.onclick=()=>wrapper.remove();

    wrapper.appendChild(link);
    wrapper.appendChild(download);
    wrapper.appendChild(del);
    container.appendChild(wrapper);
  }
}

function zoomImage(src){
  document.getElementById('modal').style.display='flex';
  document.getElementById('modalImg').src=src;
}

function closeModal(){
  document.getElementById('modal').style.display='none';
}
</script>

</body>
</html>
